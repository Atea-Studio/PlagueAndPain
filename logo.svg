<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define a filter for a subtle dripping (distortion) effect -->
  <defs>
    <filter id="drip">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="200" fill="#111" />
  
  <!-- Text with dripping effect -->
  <text x="150" y="120" fill="#e00" font-size="40" font-family="monospace" filter="url(#drip)">
    Plague &amp; Pain
  </text>
</svg>
